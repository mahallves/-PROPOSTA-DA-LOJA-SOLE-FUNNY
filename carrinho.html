<!DOCTYPE html>
<html lang="pt-br">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Carrinho - Tênis Engraçados</title> 
    <style> 
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: Arial, Helvetica, sans-serif; 
        } 
        body { 
            background: #0d0d0d; 
            color: white; 
            min-height: 100vh; 
        } 
        header { 
            background: #111; 
            border-bottom: 1px solid #292929; 
        } 
        .topo { 
            height: 82px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 6%; 
            gap: 30px; 
        } 
        .logo { 
            color: #ffd500; 
            font-size: 25px; 
            font-weight: 900; 
            text-decoration: none; 
            white-space: nowrap; 
        } 
        .pesquisa { 
            width: 430px; 
            height: 43px; 
            background: #1c1c1c; 
            border: 1px solid #333; 
            border-radius: 8px; 
            padding: 0 15px; 
            display: flex; 
            align-items: center; 
        } 
        .pesquisa input { 
            width: 100%; 
            background: transparent; 
            border: none; 
            outline: none; 
            color: white; 
            font-size: 14px; 
        } 
        .pesquisa input::placeholder { 
            color: #777; 
        } 
        .acoes { 
            display: flex; 
            gap: 22px; 
        } 
        .acoes a { 
            color: #ddd; 
            text-decoration: none; 
            font-size: 14px; 
        } 
        .acoes a:hover { 
            color: #ffd500; 
        } 
        nav { 
            height: 50px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border-top: 1px solid #222; 
        } 
        nav ul { 
            display: flex; 
            list-style: none; 
            gap: 38px; 
        } 
        nav a { 
            color: #ddd; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 600; 
        } 
        nav a:hover { 
            color: #ffd500; 
        } 
        .conteudo { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 55px 30px 80px; 
        } 
        .titulo { 
            margin-bottom: 35px; 
        } 
        .titulo h1 { 
            font-size: 36px; 
            margin-bottom: 8px; 
        } 
        .titulo p { 
            color: #888; 
            font-size: 15px; 
        } 
        .carrinho { 
            display: grid; 
            grid-template-columns: 1fr 350px; 
            gap: 30px; 
        } 
        .produtos { 
            background: #151515; 
            border: 1px solid #292929; 
            border-radius: 12px; 
            padding: 25px; 
        } 
        .produto { 
            display: grid; 
            grid-template-columns: 125px 1fr auto; 
            gap: 25px; 
            align-items: center; 
            padding: 20px 0; 
            border-bottom: 1px solid #292929; 
        } 
        .produto:first-child { 
            padding-top: 0; 
        } 
        .produto:last-child { 
            border-bottom: none; 
            padding-bottom: 0; 
        } 
        .produto-imagem { 
            width: 125px; 
            height: 105px; 
            border-radius: 9px; 
            background: #202020; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        } 
        .produto-imagem img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        } 
        .produto-info h2 { 
            font-size: 18px; 
            margin-bottom: 9px; 
        } 
        .produto-info p { 
            color: #888; 
            font-size: 13px; 
            margin-bottom: 12px; 
        } 
        .produto-info a { 
            color: #e33; 
            text-decoration: none; 
            font-size: 12px; 
        } 
        .produto-info a:hover {
            text-decoration: underline;
        }
        .quantidade { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        } 
        .quantidade button { 
            width: 30px; 
            height: 30px; 
            background: #252525; 
            border: 1px solid #3a3a3a; 
            color: white; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
        } 
        .quantidade button:hover { 
            border-color: #ffd500; 
            color: #ffd500; 
        } 
        .quantidade span { 
            min-width: 15px; 
            text-align: center; 
        } 
        .preco { 
            text-align: right; 
            min-width: 90px; 
        } 
        .preco strong { 
            font-size: 18px; 
        } 
        .resumo { 
            height: fit-content; 
            background: #151515; 
            border: 1px solid #292929; 
            border-radius: 12px; 
            padding: 28px; 
        } 
        .resumo h2 { 
            font-size: 22px; 
            margin-bottom: 25px; 
        } 
        .linha { 
            display: flex; 
            justify-content: space-between; 
            color: #aaa; 
            font-size: 14px; 
            margin-bottom: 18px; 
        } 
        .linha.total { 
            color: white; 
            border-top: 1px solid #303030; 
            padding-top: 20px; 
            margin-top: 10px; 
            font-size: 18px; 
            font-weight: bold; 
        } 
        .linha.total span:last-child { 
            color: #ffd500; 
            font-size: 24px; 
        } 
        .cupom { 
            margin: 25px 0; 
        } 
        .cupom label { 
            display: block; 
            color: #aaa; 
            font-size: 13px; 
            margin-bottom: 8px; 
        } 
        .cupom-area { 
            display: flex; 
            gap: 8px; 
        } 
        .cupom input { 
            min-width: 0; 
            flex: 1; 
            height: 43px; 
            background: #202020; 
            border: 1px solid #333; 
            border-radius: 6px; 
            color: white; 
            padding: 0 12px; 
            outline: none; 
        } 
        .cupom input:focus {
            border-color: #ffd500;
        }
        .cupom button { 
            background: #252525; 
            border: 1px solid #444; 
            color: #ffd500; 
            padding: 0 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        } 
        .cupom button:hover {
            background: #333;
        }
        .finalizar { 
            width: 100%; 
            height: 52px; 
            background: #ffd500; 
            color: #111; 
            border: none; 
            border-radius: 7px; 
            font-size: 15px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: background 0.2s;
        } 
        .finalizar:hover { 
            background: #e8c000; 
        } 
        .continuar { 
            display: block; 
            text-align: center; 
            margin-top: 20px; 
            color: #aaa; 
            text-decoration: none; 
            font-size: 13px; 
        } 
        .continuar:hover { 
            color: #ffd500; 
        } 
        .seguranca { 
            margin-top: 25px; 
            padding-top: 20px; 
            border-top: 1px solid #292929; 
            text-align: center; 
            color: #666; 
            font-size: 12px; 
        } 
        @media (max-width: 900px) { 
            .pesquisa { width: 300px; } 
            .carrinho { grid-template-columns: 1fr; } 
        } 
        @media (max-width: 650px) { 
            .topo { height: auto; padding: 20px; flex-wrap: wrap; } 
            .logo { width: 100%; text-align: center; } 
            .pesquisa { width: 100%; } 
            .acoes { width: 100%; justify-content: center; } 
            nav { overflow-x: auto; justify-content: flex-start; padding: 15px; } 
            nav ul { gap: 25px; white-space: nowrap; } 
            .conteudo { padding: 35px 15px; } 
            .produto { grid-template-columns: 90px 1fr; gap: 15px; align-items: start; } 
            .produto-imagem { width: 90px; height: 85px; } 
            .preco { grid-column: 2; text-align: left; min-width: auto; margin-top: 5px; } 
            .quantidade { grid-column: 2; margin-top: 5px; } 
        } 
    </style>
</head>

    <main class="conteudo"> 
        <div class="titulo">
